[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aria"
version = "1.0.0"
description = "Agentic Reasoning and Intelligence Architecture"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*", "api*", "config*", "core*",
    "db*", "memory*", "models*", "observability*",
    "responsible_ai*", "shared*", "tools*", "ui*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# timeout requires pytest-timeout — installed via requirements.txt
# timeout = 60
markers = [
    "integration: marks tests that require real API keys (deselect with -m 'not integration')",
    "slow: marks tests that take more than 10 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
